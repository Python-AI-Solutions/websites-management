repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: local
    hooks:
      - id: public-repo-guardrails
        name: Public repo leak guardrails
        entry: scripts/check-public-guardrails.sh --staged
        language: system
        pass_filenames: false
      - id: tofu-fmt
        name: OpenTofu fmt
        entry: bash -c "cd root && tofu fmt -recursive"
        language: system
        pass_filenames: false
      - id: tflint
        name: tflint
        entry: bash -c "cd root && tflint --init && tflint"
        language: system
        pass_filenames: false
