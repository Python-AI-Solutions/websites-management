name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Determine workspace
        id: workspace
        run: |
          labels_json='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "${labels_json}" | grep -iq '"workspace:prod"'; then
            echo "workspace=prod" >> "${GITHUB_OUTPUT}"
            echo "tfvars=envs/prod.tfvars" >> "${GITHUB_OUTPUT}"
          else
            echo "workspace=staging" >> "${GITHUB_OUTPUT}"
            echo "tfvars=envs/staging.tfvars" >> "${GITHUB_OUTPUT}"
          fi

      - name: OpenTofu init
        run: pixi run init

      - name: Select workspace
        run: pixi run "ws:${{ steps.workspace.outputs.workspace }}"

      - name: Plan
        run: |
          pixi run "plan:${{ steps.workspace.outputs.workspace }}"
          scripts/tofu.sh show -no-color tfplan-${{ steps.workspace.outputs.workspace }}.tfplan > root/tfplan-${{ steps.workspace.outputs.workspace }}.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ steps.workspace.outputs.workspace }}
          path: |
            root/tfplan-${{ steps.workspace.outputs.workspace }}.tfplan
            root/tfplan-${{ steps.workspace.outputs.workspace }}.txt

  apply:
    name: Apply (prod)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: OpenTofu init
        run: pixi run init

      - name: Select workspace
        run: pixi run "ws:prod"

      - name: Plan (prod)
        run: pixi run "plan:prod"

      - name: Apply (prod)
        run: pixi run "apply:prod"
