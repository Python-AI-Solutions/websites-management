name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Determine workspace
        id: workspace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            labels_json='${{ toJson(github.event.pull_request.labels.*.name) }}'
          else
            labels_json='[]'
          fi

          if echo "${labels_json}" | grep -iq '"workspace:prod"'; then
            echo "workspace=prod" >> "${GITHUB_OUTPUT}"
          else
            echo "workspace=staging" >> "${GITHUB_OUTPUT}"
          fi

      - name: OpenTofu init
        run: pixi run init

      - name: Select workspace
        run: pixi run "workspace-${{ steps.workspace.outputs.workspace }}"

      - name: Plan
        run: pixi run "plan-${{ steps.workspace.outputs.workspace }}"
