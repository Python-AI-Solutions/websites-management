name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: OpenTofu init
        run: pixi run init

      - name: OpenTofu fmt check
        run: pixi run bash -c 'cd root && tofu fmt -check -recursive'

      - name: OpenTofu validate
        run: pixi run validate

      - name: TFLint
        run: pixi run lint
