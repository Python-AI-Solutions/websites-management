# Cloudflare Pages Deployment Template
#
# Copy this file to your site repository at: .github/workflows/deploy.yml
#
# Prerequisites:
# 1. Cloudflare Pages project must be created via IaC (cloudflare-management repo)
# 2. GitHub secret CLOUDFLARE_API_TOKEN must be configured in repository settings
#
# Customize the following variables for your site:
# - PROJECT_NAME: Must match the Pages project name in Terraform
# - BUILD_COMMAND: Command to build your site (e.g., "pixi run build", "npm run build")
# - BUILD_DIR: Output directory containing built site (e.g., "_site", "out", "dist")
#
# Optional: Add steps for copying additional files to BUILD_DIR if needed
# (e.g., routes/_routes.json, _headers, _redirects)

name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  PROJECT_NAME: "CHANGE_ME"  # Must match Terraform pages_projects key
  BUILD_DIR: "CHANGE_ME"     # e.g., "_site", "out", "dist"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Uncomment the following lines if your project uses git submodules:
        # with:
        #   submodules: recursive

      # Choose ONE of the following setup options based on your project:

      # Option 1: For Pixi projects (Quarto, Python, etc.)
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      # Option 2: For Node.js projects (Next.js, React, etc.)
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'

      # Install dependencies
      - name: Install dependencies
        run: pixi install  # Pixi projects: "pixi install"
                          # Node.js projects: "npm install" or use retry logic:
                          # for i in 1 2 3; do npm install && break || sleep 10; done

      # Optional: Run linting/formatting
      # - name: Run pre-commit hooks
      #   run: pixi run hooks  # or: npm run lint

      # Optional: Run tests
      # - name: Run tests
      #   run: pixi run test  # or: npm test

      # Build the site
      - name: Build site
        run: CHANGE_ME  # e.g., "pixi run build" or "npm run build"

      # Optional: Copy additional files to build directory
      # - name: Copy routing config
      #   run: cp routes/_routes.json ${{ env.BUILD_DIR }}/

      # Install wrangler CLI
      - name: Install wrangler
        run: npm install -g wrangler

      # Deploy preview for pull requests
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: cloudflare-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          output=$(wrangler pages deploy ./${{ env.BUILD_DIR }} --project-name ${{ env.PROJECT_NAME }} --branch ${{ github.head_ref }})
          echo "$output"
          url=$(echo "$output" | grep -o 'https://[^ ]*\.pages\.dev' | head -1)
          echo "preview_url=$url" >> $GITHUB_OUTPUT

      # Post preview URL as PR comment
      - name: Comment PR with preview link
        if: github.event_name == 'pull_request' && steps.cloudflare-preview.outputs.preview_url
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const previewUrl = '${{ steps.cloudflare-preview.outputs.preview_url }}';

            const comment = `## 🚀 Cloudflare Pages Preview Deployed!

            **Preview URL:** ${previewUrl}

            **Commit:** \`${sha}\`
            **Status:** ✅ Ready

            This preview will be automatically updated when you push new commits.`;

            // Find existing comment to update (avoid duplicates)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Cloudflare Pages Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment,
              });
            }

      # Deploy production for main branch
      - name: Deploy production
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler pages deploy ./${{ env.BUILD_DIR }} --project-name ${{ env.PROJECT_NAME }} --branch main --commit-dirty=true
